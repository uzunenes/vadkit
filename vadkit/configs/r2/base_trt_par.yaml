# Deployment back-end of base.yaml with parallel optical flow: TensorRT FP16 engines for the detector and pose; PyTorch image encoder;
# parallel CPU thread for DIS flow.
name: r2_base_trt_par
parallel_flow: true
gap:
  ped1: 1
  ped2: 1
  avenue: 2
  shanghaitech: 2
width: 640
detector:
  name: yolo_motion
  args:
    weights: yolo11n.engine
    conf: 0.25
pose:
  name: yolo
  args:
    weights: yolo11n-pose.engine
    conf: 0.25
flow:
  name: dis
encoder:
  name: open_clip
  args:
    model: MobileCLIP2-S0
    pretrained: dfndr2b
attributes:
- name: ovel
  kind: orientation_hist
- name: opose
  kind: pose_keypoints
- name: oapp
  kind: appearance_pca
  args:
    dim: 64
density: niw
seed: 0
train_every: 1
drop_startup: false
calibrator: fisher
fusion:
  name: sum
temporal:
  name: causal_median
  args:
    k: 9
warmup: 4
